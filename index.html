<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Payment Details</title>
    <link rel="icon" href="logo.png" type="image/png">
</head>
<body>

    <!-- Main Mobile Display Container (iPhone Style) -->
    <div id="box">
        <!-- iOS Status Bar -->
        <div class="status-bar">
            <div class="status-left">
                <span id="display-time">03:29</span>
            </div>
            <div class="status-right">
                <span class="ios-signal">📶</span>
                <span class="ios-wifi">📶</span>
                <div class="ios-battery-container">
                    <div class="ios-battery-body">
                        <div id="display-battery-fill" class="ios-battery-fill"></div>
                    </div>
                    <div class="ios-battery-tip"></div>
                </div>
            </div>
        </div>

        <!-- Header Navigation -->
        <div class="app-header">
            <span class="back-arrow">&#10094;</span>
            <h1 class="page-title">Payment Details</h1>
        </div>

        <!-- Main Content Area -->
        <div class="payment-summary">
            <span class="amount-label">Amount</span>
            <div id="display-amount" class="main-amount">-10 USDT</div>
            <div class="status-badge">
                <span class="check-icon">&#10003;</span> Completed
            </div>
        </div>

        <!-- Transaction Details List -->
        <div class="details-container">
            <div class="detail-item">
                <span class="item-label">To</span>
                <div class="item-value-group">
                    <span id="display-trader-id" class="primary-value bold">37639398</span>
                    <span id="display-username" class="secondary-value">Raza00</span>
                </div>
                <span class="chevron-arrow">&#10095;</span>
            </div>

            <div class="detail-item">
                <span class="item-label">Note</span>
                <span class="item-value text-muted">--</span>
            </div>

            <div class="detail-item">
                <span class="item-label">Time</span>
                <span id="display-datetime" class="item-value">2025-08-28 15:58:13</span>
            </div>

            <div class="detail-item">
                <span class="item-label">Order ID</span>
                <div class="order-id-wrapper">
                    <span id="display-order-id" class="item-value">383415796060930048</span>
                    <span class="copy-button-icon">&#9166;</span>
                </div>
            </div>

            <div class="detail-item">
                <span class="item-label">Payment Method</span>
                <span class="item-value">Funding Account</span>
            </div>

            <div class="detail-item">
                <span class="item-label">Paid With</span>
                <span id="display-paid-with" class="item-value bold">10 USDT</span>
            </div>
        </div>
    </div>
    
    <!-- Dynamic System Control Panel -->
    <div class="control-panel">
        <h2>System Controller</h2>
        
        <div class="control-group">
            <label>Top Time:</label>
            <input type="text" id="input-time" value="03:29">
        </div>

        <div class="control-group">
            <label>Battery (%):</label>
            <input type="number" id="input-battery" value="55" min="0" max="100">
        </div>

        <div class="control-group">
            <label>Amount (USDT):</label>
            <input type="text" id="input-amount" value="-10 USDT">
        </div>

        <div class="control-group">
            <label>Trader ID:</label>
            <input type="text" id="input-trader-id" value="37639398">
        </div>

        <div class="control-group">
            <label>Username Name:</label>
            <input type="text" id="input-username" value="Raza00">
        </div>

        <div class="control-group">
            <label>Transaction Time:</label>
            <input type="text" id="input-datetime" value="2025-08-28 15:58:13">
        </div>

        <div class="control-group">
            <label>Order ID:</label>
            <input type="text" id="input-order-id" value="383415796060930048">
        </div>

        <div class="control-group">
            <label>Paid Quantity:</label>
            <input type="text" id="input-paid-with" value="10 USDT">
        </div>

        <button class="download-btn">
            <img src="https://raw.githubusercontent.com/ahmad-bhai/zeetex-currency-rate/0f914c89358480c47e3fdbb8a74f7020d938cf36/download.svg" alt="Download">
            Download Screenshot
        </button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="script.js"></script>
</body>
</html>
